<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <!-- Background -->
  <rect width="1200" height="400" fill="#0a0a0a"/>
  
  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <rect width="1200" height="400" fill="url(#grid)"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="monospace" font-size="32" font-weight="bold" fill="#d0d0d0" text-anchor="middle" letter-spacing="4">
    HARMONIC CODING
  </text>
  
  <!-- Reference axis lines -->
  <line x1="100" y1="200" x2="1100" y2="200" stroke="#333333" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="100" x2="1100" y2="100" stroke="#333333" stroke-width="0.5" opacity="0.3"/>
  <line x1="100" y1="300" x2="1100" y2="300" stroke="#333333" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Left signal (specification) - downward slope -->
  <polyline points="100,150 200,160 300,170 400,180 500,190 600,200" 
            fill="none" stroke="#cccccc" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Right signal (execution) - upward slope -->
  <polyline points="600,200 700,190 800,180 900,170 1000,160 1100,150" 
            fill="none" stroke="#cccccc" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Harmonic overlay - convergence point emphasis -->
  <circle cx="600" cy="200" r="6" fill="none" stroke="#cccccc" stroke-width="2" opacity="0.9"/>
  <circle cx="600" cy="200" r="3" fill="#cccccc" opacity="1"/>
  
  <!-- Subtle interference pattern around center -->
  <path d="M 550 200 Q 575 185 600 200 Q 625 215 650 200" fill="none" stroke="#666666" stroke-width="0.8" opacity="0.4"/>
  <path d="M 540 200 Q 570 170 600 200 Q 630 230 660 200" fill="none" stroke="#666666" stroke-width="0.8" opacity="0.3"/>
  
  <!-- Measurement markers at convergence -->
  <line x1="600" y1="195" x2="600" y2="205" stroke="#888888" stroke-width="1" opacity="0.6"/>
  <line x1="595" y1="200" x2="605" y2="200" stroke="#888888" stroke-width="1" opacity="0.6"/>
  
  <!-- Data origin indicators -->
  <text x="85" y="155" font-family="monospace" font-size="10" fill="#555555" opacity="0.7">SPEC</text>
  <text x="1095" y="155" font-family="monospace" font-size="10" fill="#555555" opacity="0.7" text-anchor="end">EXEC</text>
  
  <!-- Subtitle -->
  <text x="600" y="360" font-family="monospace" font-size="13" fill="#666666" text-anchor="middle" letter-spacing="1">
    harmonic convergence :: where intent becomes execution
  </text>
</svg>
