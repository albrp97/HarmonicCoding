<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <!-- Background -->
  <rect width="1920" height="600" fill="#0a0a0a"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f1f1f" stroke-width="0.8"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1920" height="600" fill="url(#grid)"/>
  
  <!-- Title -->
  <text x="960" y="85" font-family="monospace" font-size="80" font-weight="bold" fill="#f0f0f0" text-anchor="middle" letter-spacing="10">
    HARMONIC CODING
  </text>
  
  <!-- Central display area frame -->
  <rect x="150" y="130" width="1620" height="360" fill="#050505" stroke="#3a3a3a" stroke-width="3" opacity="0.8"/>
  
  <!-- Reference grid (very subtle background) -->
  <line x1="350" y1="130" x2="350" y2="490" stroke="#2a2a2a" stroke-width="0.6" opacity="0.2"/>
  <line x1="550" y1="130" x2="550" y2="490" stroke="#2a2a2a" stroke-width="0.6" opacity="0.2"/>
  <line x1="750" y1="130" x2="750" y2="490" stroke="#2a2a2a" stroke-width="0.6" opacity="0.2"/>
  <line x1="960" y1="130" x2="960" y2="490" stroke="#2a2a2a" stroke-width="0.8" opacity="0.3"/>
  <line x1="1170" y1="130" x2="1170" y2="490" stroke="#2a2a2a" stroke-width="0.6" opacity="0.2"/>
  <line x1="1370" y1="130" x2="1370" y2="490" stroke="#2a2a2a" stroke-width="0.6" opacity="0.2"/>
  <line x1="1570" y1="130" x2="1570" y2="490" stroke="#2a2a2a" stroke-width="0.6" opacity="0.2"/>
  
  <!-- Subtle reference centerline -->
  <line x1="150" y1="310" x2="1770" y2="310" stroke="#3a3a3a" stroke-width="0.6" opacity="0.25"/>
  
  <!-- LEFT SIGNAL: Specification waveform -->
  <path d="M 150,310 L 180,290 L 210,255 L 240,225 L 270,200 L 300,190 L 330,200 L 360,230 L 390,270 L 420,300 L 450,315 L 480,305 L 510,270 L 540,225 L 570,185 L 600,165 L 630,170 L 660,200 L 690,250 L 720,295 L 750,320 L 780,325 L 810,310 L 840,275 L 870,230 L 900,190 L 930,170 L 960,170" 
        fill="none" stroke="#d8d8d8" stroke-width="5" opacity="0.98" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- RIGHT SIGNAL: Execution waveform - MIRRORED -->
  <path d="M 1770,310 L 1740,290 L 1710,255 L 1680,225 L 1650,200 L 1620,190 L 1590,200 L 1560,230 L 1530,270 L 1500,300 L 1470,315 L 1440,305 L 1410,270 L 1380,225 L 1350,185 L 1320,165 L 1290,170 L 1260,200 L 1230,250 L 1200,295 L 1170,320 L 1140,325 L 1110,310 L 1080,275 L 1050,230 L 1020,190 L 990,170 L 960,170" 
        fill="none" stroke="#d8d8d8" stroke-width="5" opacity="0.98" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- CENTER CONVERGENCE ZONE: Primary harmonic (constructive interference) -->
  <path d="M 955,170 Q 957,150 960,120 Q 963,150 965,170" 
        fill="none" stroke="#e8e8e8" stroke-width="8" opacity="1" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Secondary harmonic (2x frequency) - visible -->
  <path d="M 950,310 Q 952,295 955,280 Q 958,295 960,310 Q 962,295 965,280 Q 968,295 970,310" 
        fill="none" stroke="#c0c0c0" stroke-width="3.5" opacity="0.7"/>
  
  <!-- Tertiary harmonic (3x frequency) - subtle -->
  <path d="M 945,310 Q 948,305 952,300 Q 956,305 960,310 Q 964,305 968,300 Q 972,305 975,310" 
        fill="none" stroke="#a0a0a0" stroke-width="2" opacity="0.5"/>
  
  <!-- Central convergence point - PROMINENT -->
  <circle cx="960" cy="120" r="22" fill="none" stroke="#e8e8e8" stroke-width="5" opacity="1" filter="url(#glow)"/>
  <circle cx="960" cy="120" r="11" fill="#e8e8e8" opacity="1"/>
  
  <!-- Measurement crosshairs -->
  <line x1="960" y1="100" x2="960" y2="140" stroke="#a0a0a0" stroke-width="3.5" opacity="0.9"/>
  <line x1="938" y1="120" x2="982" y2="120" stroke="#a0a0a0" stroke-width="3.5" opacity="0.9"/>
  
  <!-- Phase alignment indicators (subtle sync lines) -->
  <line x1="180" y1="310" x2="220" y2="310" stroke="#5a5a5a" stroke-width="1.5" opacity="0.5" stroke-dasharray="5,5"/>
  <line x1="1700" y1="310" x2="1740" y2="310" stroke="#5a5a5a" stroke-width="1.5" opacity="0.5" stroke-dasharray="5,5"/>
  
  <!-- Signal labels -->
  <text x="140" y="330" font-family="monospace" font-size="18" font-weight="bold" fill="#a8a8a8" opacity="0.95">SPEC</text>
  <text x="1760" y="330" font-family="monospace" font-size="18" font-weight="bold" fill="#a8a8a8" opacity="0.95" text-anchor="end">EXEC</text>
  
  <!-- Center label -->
  <text x="960" y="515" font-family="monospace" font-size="26" font-weight="bold" fill="#c0c0c0" text-anchor="middle" letter-spacing="3">
    HARMONIC CONVERGENCE
  </text>
  
  <!-- Explanation -->
  <text x="960" y="545" font-family="monospace" font-size="15" fill="#7a7a7a" text-anchor="middle" letter-spacing="2">
    CONSTRUCTIVE INTERFERENCE :: SPECIFICATION + EXECUTION = HARMONIC SYNTHESIS
  </text>
</svg>
