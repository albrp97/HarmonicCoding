<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <!-- Background -->
  <rect width="1200" height="400" fill="#f5f5f5"/>
  
  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e8e8e8" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <rect width="1200" height="400" fill="url(#grid)"/>
  
  <!-- Title text -->
  <text x="600" y="40" font-family="monospace" font-size="32" font-weight="bold" fill="#1a1a1a" text-anchor="middle" letter-spacing="4">
    HARMONIC CODING
  </text>
  
  <!-- Human Directive Wave (top) - symmetrical descent -->
  <path d="M 0 120 Q 75 105 150 120 T 300 120 T 450 120 T 600 120 T 750 120 T 900 120 T 1050 120 T 1200 120" 
        fill="none" stroke="#2a2a2a" stroke-width="2.5" opacity="0.9"/>
  
  <!-- AI Execution Wave (bottom) - symmetrical ascent -->
  <path d="M 0 280 Q 75 295 150 280 T 300 280 T 450 280 T 600 280 T 750 280 T 900 280 T 1050 280 T 1200 280" 
        fill="none" stroke="#2a2a2a" stroke-width="2.5" opacity="0.9"/>
  
  <!-- Convergence zone - subtle intersection lines -->
  <line x1="200" y1="150" x2="200" y2="250" stroke="#5a5a5a" stroke-width="1" opacity="0.4"/>
  <line x1="400" y1="145" x2="400" y2="255" stroke="#5a5a5a" stroke-width="1" opacity="0.4"/>
  <line x1="600" y1="140" x2="600" y2="260" stroke="#5a5a5a" stroke-width="1" opacity="0.5"/>
  <line x1="800" y1="145" x2="800" y2="255" stroke="#5a5a5a" stroke-width="1" opacity="0.4"/>
  <line x1="1000" y1="150" x2="1000" y2="250" stroke="#5a5a5a" stroke-width="1" opacity="0.4"/>
  
  <!-- Central harmonic plane -->
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#1a1a1a" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Central resonance points -->
  <circle cx="300" cy="200" r="2.5" fill="#1a1a1a" opacity="0.8"/>
  <circle cx="600" cy="200" r="4" fill="#1a1a1a" opacity="1"/>
  <circle cx="900" cy="200" r="2.5" fill="#1a1a1a" opacity="0.8"/>
  
  <!-- Subtle phase difference indicator -->
  <path d="M 600 120 L 600 280" stroke="#5a5a5a" stroke-width="1" opacity="0.3" stroke-dasharray="2,4"/>
  
  <!-- Subtitle -->
  <text x="600" y="360" font-family="monospace" font-size="13" fill="#666666" text-anchor="middle" letter-spacing="1">
    specification resonance :: execution synthesis
  </text>
</svg>
