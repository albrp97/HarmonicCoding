<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <!-- Background -->
  <rect width="1920" height="600" fill="#0a0a0a"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f1f1f" stroke-width="0.8"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1920" height="600" fill="url(#grid)"/>
  
  <!-- Title -->
  <text x="960" y="85" font-family="monospace" font-size="80" font-weight="bold" fill="#f0f0f0" text-anchor="middle" letter-spacing="10">
    HARMONIC CODING
  </text>
  
  <!-- Central display area frame -->
  <rect x="150" y="130" width="1620" height="360" fill="#050505" stroke="#3a3a3a" stroke-width="3" opacity="0.8"/>
  
  <!-- Reference grid (subtle background) -->
  <line x1="350" y1="130" x2="350" y2="490" stroke="#2a2a2a" stroke-width="0.8" opacity="0.25"/>
  <line x1="550" y1="130" x2="550" y2="490" stroke="#2a2a2a" stroke-width="0.8" opacity="0.25"/>
  <line x1="750" y1="130" x2="750" y2="490" stroke="#2a2a2a" stroke-width="0.8" opacity="0.25"/>
  <line x1="960" y1="130" x2="960" y2="490" stroke="#2a2a2a" stroke-width="1" opacity="0.35"/>
  <line x1="1170" y1="130" x2="1170" y2="490" stroke="#2a2a2a" stroke-width="0.8" opacity="0.25"/>
  <line x1="1370" y1="130" x2="1370" y2="490" stroke="#2a2a2a" stroke-width="0.8" opacity="0.25"/>
  <line x1="1570" y1="130" x2="1570" y2="490" stroke="#2a2a2a" stroke-width="0.8" opacity="0.25"/>
  
  <!-- Subtle reference centerline -->
  <line x1="150" y1="310" x2="1770" y2="310" stroke="#3a3a3a" stroke-width="0.8" opacity="0.3"/>
  
  <!-- LEFT SIGNAL: Specification waveform - MORE AMPLITUDE -->
  <path d="M 150,310 L 180,295 L 210,270 L 240,250 L 270,240 L 300,245 L 330,270 L 360,295 L 390,310 L 420,315 L 450,305 L 480,280 L 510,255 L 540,240 L 570,245 L 600,270 L 630,295 L 660,310 L 690,318 L 720,310 L 750,290 L 780,260 L 810,240 L 840,240 L 870,255 L 900,280 L 930,300 L 960,310" 
        fill="none" stroke="#d8d8d8" stroke-width="4.5" opacity="0.95" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- RIGHT SIGNAL: Execution waveform - MORE AMPLITUDE, MIRRORED -->
  <path d="M 1770,310 L 1740,295 L 1710,270 L 1680,250 L 1650,240 L 1620,245 L 1590,270 L 1560,295 L 1530,310 L 1500,315 L 1470,305 L 1440,280 L 1410,255 L 1380,240 L 1350,245 L 1320,270 L 1290,295 L 1260,310 L 1230,318 L 1200,310 L 1170,290 L 1140,260 L 1110,240 L 1080,240 L 1050,255 L 1020,280 L 990,300 L 960,310" 
        fill="none" stroke="#d8d8d8" stroke-width="4.5" opacity="0.95" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- CENTER CONVERGENCE ZONE: Interference pattern -->
  <!-- Main peak (constructive interference) - PROMINENT -->
  <path d="M 950,310 Q 955,270 960,240 Q 965,270 970,310" 
        fill="none" stroke="#e8e8e8" stroke-width="6.5" opacity="1" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Secondary harmonic (2x frequency) - visible but subtler -->
  <path d="M 950,310 Q 952,295 955,285 Q 958,295 960,310 Q 962,295 965,285 Q 968,295 970,310" 
        fill="none" stroke="#b0b0b0" stroke-width="3" opacity="0.65"/>
  
  <!-- Central convergence point -->
  <circle cx="960" cy="240" r="18" fill="none" stroke="#e8e8e8" stroke-width="4" opacity="1" filter="url(#glow)"/>
  <circle cx="960" cy="240" r="9" fill="#e8e8e8" opacity="1"/>
  
  <!-- Measurement markers -->
  <line x1="960" y1="225" x2="960" y2="255" stroke="#a0a0a0" stroke-width="3" opacity="0.85"/>
  <line x1="940" y1="240" x2="980" y2="240" stroke="#a0a0a0" stroke-width="3" opacity="0.85"/>
  
  <!-- Phase alignment indicators -->
  <line x1="180" y1="310" x2="220" y2="310" stroke="#5a5a5a" stroke-width="1.5" opacity="0.5" stroke-dasharray="5,5"/>
  <line x1="1700" y1="310" x2="1740" y2="310" stroke="#5a5a5a" stroke-width="1.5" opacity="0.5" stroke-dasharray="5,5"/>
  
  <!-- Signal labels -->
  <text x="140" y="330" font-family="monospace" font-size="18" font-weight="bold" fill="#a8a8a8" opacity="0.95">SPEC</text>
  <text x="1760" y="330" font-family="monospace" font-size="18" font-weight="bold" fill="#a8a8a8" opacity="0.95" text-anchor="end">EXEC</text>
  
  <!-- Center label -->
  <text x="960" y="515" font-family="monospace" font-size="26" font-weight="bold" fill="#c0c0c0" text-anchor="middle" letter-spacing="3">
    HARMONIC CONVERGENCE
  </text>
  
  <!-- Explanation -->
  <text x="960" y="545" font-family="monospace" font-size="15" fill="#7a7a7a" text-anchor="middle" letter-spacing="2">
    CONSTRUCTIVE INTERFERENCE :: SPECIFICATION + EXECUTION = HARMONIC SYNTHESIS
  </text>
</svg>
