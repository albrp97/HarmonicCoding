<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <!-- Background -->
  <rect width="1920" height="600" fill="#0a0a0a"/>
  
  <!-- Grid pattern for sophistication -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f1f1f" stroke-width="0.8"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1920" height="600" fill="url(#grid)"/>
  
  <!-- Title - Large and dominant -->
  <text x="960" y="85" font-family="monospace" font-size="80" font-weight="bold" fill="#f0f0f0" text-anchor="middle" letter-spacing="10">
    HARMONIC CODING
  </text>
  
  <!-- Central display area - oscilloscope-like frame -->
  <rect x="150" y="130" width="1620" height="360" fill="#050505" stroke="#3a3a3a" stroke-width="3" opacity="0.8"/>
  
  <!-- Reference grid lines (vertical) - more visible -->
  <line x1="350" y1="130" x2="350" y2="490" stroke="#2a2a2a" stroke-width="1.2" opacity="0.6"/>
  <line x1="550" y1="130" x2="550" y2="490" stroke="#2a2a2a" stroke-width="1.2" opacity="0.6"/>
  <line x1="750" y1="130" x2="750" y2="490" stroke="#2a2a2a" stroke-width="1.2" opacity="0.6"/>
  <line x1="960" y1="130" x2="960" y2="490" stroke="#3a3a3a" stroke-width="1.5" opacity="0.7"/>
  <line x1="1170" y1="130" x2="1170" y2="490" stroke="#2a2a2a" stroke-width="1.2" opacity="0.6"/>
  <line x1="1370" y1="130" x2="1370" y2="490" stroke="#2a2a2a" stroke-width="1.2" opacity="0.6"/>
  <line x1="1570" y1="130" x2="1570" y2="490" stroke="#2a2a2a" stroke-width="1.2" opacity="0.6"/>
  
  <!-- Reference grid lines (horizontal) - more visible -->
  <line x1="150" y1="230" x2="1770" y2="230" stroke="#2a2a2a" stroke-width="1.2" opacity="0.6"/>
  <line x1="150" y1="310" x2="1770" y2="310" stroke="#3a3a3a" stroke-width="1.5" opacity="0.7"/>
  <line x1="150" y1="390" x2="1770" y2="390" stroke="#2a2a2a" stroke-width="1.2" opacity="0.6"/>
  
  <!-- Center reference line (critical axis) -->
  <line x1="150" y1="310" x2="1770" y2="310" stroke="#5a5a5a" stroke-width="2.5" opacity="0.8"/>
  
  <!-- Specification signal (left to center) - THICKER -->
  <polyline points="150,290 300,295 450,300 600,303 750,305 860,308" 
            fill="none" stroke="#d8d8d8" stroke-width="4" opacity="0.95" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Execution signal (right to center) - mirror - THICKER -->
  <polyline points="1060,312 1170,309 1320,306 1470,303 1620,298 1770,290" 
            fill="none" stroke="#d8d8d8" stroke-width="4" opacity="0.95" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Convergence zone - central harmonic intersection with glow -->
  <circle cx="960" cy="310" r="14" fill="none" stroke="#e0e0e0" stroke-width="3.5" opacity="1" filter="url(#glow)"/>
  <circle cx="960" cy="310" r="7" fill="#e8e8e8" opacity="1"/>
  
  <!-- Harmonic resonance indicators (overtones) -->
  <path d="M 960 310 Q 925 285 890 310 Q 925 335 960 310" 
        fill="none" stroke="#888888" stroke-width="2" opacity="0.5"/>
  <path d="M 960 310 Q 995 285 1030 310 Q 995 335 960 310" 
        fill="none" stroke="#888888" stroke-width="2" opacity="0.5"/>
  
  <!-- Measurement scale markers -->
  <line x1="960" y1="303" x2="960" y2="317" stroke="#a0a0a0" stroke-width="2.5" opacity="0.85"/>
  <line x1="952" y1="310" x2="968" y2="310" stroke="#a0a0a0" stroke-width="2.5" opacity="0.85"/>
  
  <!-- Phase alignment indicators -->
  <line x1="180" y1="310" x2="230" y2="310" stroke="#5a5a5a" stroke-width="1.5" opacity="0.6" stroke-dasharray="5,5"/>
  <line x1="1690" y1="310" x2="1740" y2="310" stroke="#5a5a5a" stroke-width="1.5" opacity="0.6" stroke-dasharray="5,5"/>
  
  <!-- Signal labels - larger and clearer -->
  <text x="140" y="295" font-family="monospace" font-size="18" font-weight="bold" fill="#a8a8a8" opacity="0.95">SPEC</text>
  <text x="1760" y="295" font-family="monospace" font-size="18" font-weight="bold" fill="#a8a8a8" opacity="0.95" text-anchor="end">EXEC</text>
  
  <!-- Subtitle - Main message -->
  <text x="960" y="545" font-family="monospace" font-size="26" font-weight="bold" fill="#c0c0c0" text-anchor="middle" letter-spacing="3">
    HARMONIC CONVERGENCE
  </text>
  
  <!-- Subtitle explanation -->
  <text x="960" y="575" font-family="monospace" font-size="15" fill="#7a7a7a" text-anchor="middle" letter-spacing="2">
    WHERE HUMAN INTENT BECOMES MACHINE EXECUTION
  </text>
</svg>
