<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <!-- Background -->
  <rect width="1920" height="600" fill="#0a0a0a"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f1f1f" stroke-width="0.8"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1920" height="600" fill="url(#grid)"/>
  
  <!-- Title -->
  <text x="960" y="85" font-family="monospace" font-size="80" font-weight="bold" fill="#f0f0f0" text-anchor="middle" letter-spacing="10">
    HARMONIC CODING
  </text>
  
  <!-- Central display area frame -->
  <rect x="150" y="130" width="1620" height="360" fill="#050505" stroke="#3a3a3a" stroke-width="3" opacity="0.8"/>
  
  <!-- Subtle reference line (very thin now) -->
  <line x1="150" y1="310" x2="1770" y2="310" stroke="#3a3a3a" stroke-width="1" opacity="0.4"/>
  
  <!-- Reference grid (subtle background) -->
  <line x1="350" y1="130" x2="350" y2="490" stroke="#2a2a2a" stroke-width="0.8" opacity="0.3"/>
  <line x1="550" y1="130" x2="550" y2="490" stroke="#2a2a2a" stroke-width="0.8" opacity="0.3"/>
  <line x1="750" y1="130" x2="750" y2="490" stroke="#2a2a2a" stroke-width="0.8" opacity="0.3"/>
  <line x1="960" y1="130" x2="960" y2="490" stroke="#2a2a2a" stroke-width="1" opacity="0.4"/>
  <line x1="1170" y1="130" x2="1170" y2="490" stroke="#2a2a2a" stroke-width="0.8" opacity="0.3"/>
  <line x1="1370" y1="130" x2="1370" y2="490" stroke="#2a2a2a" stroke-width="0.8" opacity="0.3"/>
  <line x1="1570" y1="130" x2="1570" y2="490" stroke="#2a2a2a" stroke-width="0.8" opacity="0.3"/>
  
  <!-- LEFT SIGNAL: Specification waveform (sin wave approaching) -->
  <path d="M 150,310 L 200,305 L 250,295 L 300,280 L 350,265 L 400,255 L 450,252 L 500,257 L 550,270 L 600,285 L 650,295 L 700,298 L 750,292 L 800,280 L 850,265 L 900,255 L 950,253" 
        fill="none" stroke="#d8d8d8" stroke-width="3.5" opacity="0.9" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- RIGHT SIGNAL: Execution waveform (sin wave approaching, mirrored) -->
  <path d="M 1770,310 L 1720,305 L 1670,295 L 1620,280 L 1570,265 L 1520,255 L 1470,252 L 1420,257 L 1370,270 L 1320,285 L 1270,295 L 1220,298 L 1170,292 L 1120,280 L 1070,265 L 1020,255 L 970,253" 
        fill="none" stroke="#d8d8d8" stroke-width="3.5" opacity="0.9" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- CENTER INTERFERENCE ZONE: Constructive interference pattern -->
  <!-- When waves meet, they create higher amplitude in center -->
  <path d="M 950,253 Q 955,240 960,235 Q 965,240 970,253" 
        fill="none" stroke="#e8e8e8" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Secondary harmonic (2x frequency) - subtler -->
  <path d="M 950,270 Q 955,265 960,263 Q 965,265 970,270" 
        fill="none" stroke="#b0b0b0" stroke-width="2.5" opacity="0.6"/>
  
  <!-- Tertiary harmonic (3x frequency) - very subtle -->
  <path d="M 950,285 Q 952,283 960,282 Q 968,283 970,285" 
        fill="none" stroke="#888888" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Central convergence point with glow -->
  <circle cx="960" cy="235" r="16" fill="none" stroke="#e8e8e8" stroke-width="3.5" opacity="1" filter="url(#glow)"/>
  <circle cx="960" cy="235" r="8" fill="#e8e8e8" opacity="1"/>
  
  <!-- Measurement markers at peak -->
  <line x1="960" y1="225" x2="960" y2="245" stroke="#a0a0a0" stroke-width="2.5" opacity="0.8"/>
  <line x1="945" y1="235" x2="975" y2="235" stroke="#a0a0a0" stroke-width="2.5" opacity="0.8"/>
  
  <!-- Phase alignment indicators (dashed lines showing sync) -->
  <line x1="180" y1="310" x2="220" y2="310" stroke="#5a5a5a" stroke-width="1.5" opacity="0.5" stroke-dasharray="5,5"/>
  <line x1="1700" y1="310" x2="1740" y2="310" stroke="#5a5a5a" stroke-width="1.5" opacity="0.5" stroke-dasharray="5,5"/>
  
  <!-- Subtle wave direction indicators -->
  <path d="M 920,260 L 925,255" stroke="#777777" stroke-width="1.5" opacity="0.5" marker-end="url(#arrowhead)"/>
  <path d="M 1000,260 L 995,255" stroke="#777777" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Signal labels -->
  <text x="140" y="330" font-family="monospace" font-size="18" font-weight="bold" fill="#a8a8a8" opacity="0.95">SPEC</text>
  <text x="1760" y="330" font-family="monospace" font-size="18" font-weight="bold" fill="#a8a8a8" opacity="0.95" text-anchor="end">EXEC</text>
  
  <!-- Center label -->
  <text x="960" y="515" font-family="monospace" font-size="26" font-weight="bold" fill="#c0c0c0" text-anchor="middle" letter-spacing="3">
    HARMONIC CONVERGENCE
  </text>
  
  <!-- Explanation -->
  <text x="960" y="545" font-family="monospace" font-size="15" fill="#7a7a7a" text-anchor="middle" letter-spacing="2">
    CONSTRUCTIVE INTERFERENCE :: SPECIFICATION + EXECUTION = HARMONIC SYNTHESIS
  </text>
</svg>
