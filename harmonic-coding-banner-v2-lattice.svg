<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <!-- Background -->
  <rect width="1200" height="400" fill="#0f1419"/>
  
  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2233" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="nodeActive" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#cccccc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#666666;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <rect width="1200" height="400" fill="url(#grid)"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="monospace" font-size="32" font-weight="bold" fill="#e0e0e0" text-anchor="middle" letter-spacing="4">
    HARMONIC CODING
  </text>
  
  <!-- Left network (Specification) -->
  <circle cx="300" cy="120" r="3" fill="#888888" opacity="0.6"/>
  <circle cx="250" cy="180" r="2.5" fill="#888888" opacity="0.5"/>
  <circle cx="300" cy="240" r="3" fill="#888888" opacity="0.6"/>
  <circle cx="350" cy="200" r="2" fill="#888888" opacity="0.4"/>
  <line x1="300" y1="120" x2="250" y2="180" stroke="#555555" stroke-width="0.8" opacity="0.4"/>
  <line x1="300" y1="120" x2="350" y2="200" stroke="#555555" stroke-width="0.8" opacity="0.4"/>
  <line x1="250" y1="180" x2="300" y2="240" stroke="#555555" stroke-width="0.8" opacity="0.4"/>
  
  <!-- Right network (Execution) -->
  <circle cx="900" cy="120" r="3" fill="#888888" opacity="0.6"/>
  <circle cx="950" cy="180" r="2.5" fill="#888888" opacity="0.5"/>
  <circle cx="900" cy="240" r="3" fill="#888888" opacity="0.6"/>
  <circle cx="850" cy="200" r="2" fill="#888888" opacity="0.4"/>
  <line x1="900" y1="120" x2="950" y2="180" stroke="#555555" stroke-width="0.8" opacity="0.4"/>
  <line x1="900" y1="120" x2="850" y2="200" stroke="#555555" stroke-width="0.8" opacity="0.4"/>
  <line x1="950" y1="180" x2="900" y2="240" stroke="#555555" stroke-width="0.8" opacity="0.4"/>
  
  <!-- Central convergence lattice -->
  <circle cx="600" cy="200" r="3.5" fill="url(#nodeActive)" opacity="1"/>
  
  <!-- Connection paths to center (spec -> center) -->
  <path d="M 350 200 Q 475 200 597 200" fill="none" stroke="#999999" stroke-width="1.2" opacity="0.6"/>
  
  <!-- Connection paths to center (execution -> center) -->
  <path d="M 850 200 Q 725 200 603 200" fill="none" stroke="#999999" stroke-width="1.2" opacity="0.6"/>
  
  <!-- Top harmonic path -->
  <path d="M 300 120 Q 450 100 600 130 Q 750 100 900 120" fill="none" stroke="#666666" stroke-width="1" opacity="0.5"/>
  
  <!-- Bottom harmonic path -->
  <path d="M 300 240 Q 450 260 600 270 Q 750 260 900 240" fill="none" stroke="#666666" stroke-width="1" opacity="0.5"/>
  
  <!-- Minor resonance nodes -->
  <circle cx="450" cy="200" r="1.5" fill="#888888" opacity="0.5"/>
  <circle cx="750" cy="200" r="1.5" fill="#888888" opacity="0.5"/>
  
  <!-- Subtitle -->
  <text x="600" y="360" font-family="monospace" font-size="13" fill="#777777" text-anchor="middle" letter-spacing="1">
    specification :: synthesis :: execution
  </text>
</svg>
